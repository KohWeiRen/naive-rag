<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ternwell Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #172b2b;
      background: #f2f5f1;
      --accent: #125b4e;
      --border: #d9e2dc;
      --muted: #4e605b;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem max(1.25rem, calc((100% - 72rem) / 2));
      background: #17332e;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
    }

    main {
      width: min(72rem, calc(100% - 2rem));
      margin: clamp(1.5rem, 5vw, 3rem) auto;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 0.5rem 2rem #17332e0d;
    }

    .welcome {
      max-width: 29rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 5vw, 2.75rem);
    }

    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2rem); }
    button, textarea { font: inherit; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: #fff;
      color: var(--accent);
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover { background: #f2f6f3; }
    .button-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .button-primary:hover { background: #0b473e; }
    .button:disabled { opacity: 0.6; cursor: default; }
    :focus-visible { outline: 3px solid #168170; outline-offset: 3px; }

    .account-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      max-width: 100%;
      margin-left: auto;
      font-size: 0.9rem;
    }

    .account-email {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .account-controls .button {
      flex-shrink: 0;
      color: #fff;
      background: transparent;
      border-color: #77968c;
    }
    .account-controls .button:hover { background: #25463e; }

    .workspace {
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr);
      align-items: start;
      gap: 1rem;
    }

    .history { min-width: 0; padding: 1rem; }
    .history h2 { margin: 0 0 0.75rem; font-size: 1rem; }
    .history .button { width: 100%; margin-bottom: 0.75rem; }
    .history-status { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .history-status:not(:empty) { margin: 0.35rem 0; }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      max-height: 58vh;
      overflow-y: auto;
      padding: 0.25rem;
    }

    .chat-link {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      background: transparent;
      color: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .chat-link:hover { background: #f2f6f3; }
    .chat-link[aria-current="true"] { border-color: #bfd9cb; background: #e2f1eb; }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .chat-header h1 { font-size: 1.25rem; }

    .conversation {
      min-height: 15rem;
      max-height: 54vh;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .empty-state, .welcome-status, .chat-status {
      color: var(--muted);
      line-height: 1.5;
    }

    .empty-state { margin: 0; }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      width: fit-content;
      max-width: min(100%, 39rem);
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: #f7f9f7;
    }

    .message-user { align-self: flex-end; background: #e2f1eb; }
    .message-label { display: block; margin-bottom: 0.2rem; font-size: 0.8rem; }

    .message p {
      margin: 0;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .composer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .composer label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
    .composer-row { display: flex; align-items: flex-end; gap: 0.75rem; }

    textarea {
      flex: 1;
      min-width: 0;
      padding: 0.65rem 0.75rem;
      border: 1px solid #a9b9b0;
      border-radius: 0.55rem;
      color: inherit;
      resize: vertical;
    }

    .chat-status { margin: 0; font-size: 0.9rem; }
    .chat-status:not(:empty) { margin-top: 0.6rem; }
    .chat-status[data-error="true"] { color: #9e3028; }

    @media (max-width: 680px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .chat-list { max-height: 10rem; }
    }

    @media (max-width: 420px) {
      .composer-row { flex-direction: column; align-items: stretch; }
      .composer-row button { align-self: flex-end; }
    }
  </style>
  <script src="/script.js" defer></script>
</head>
<body>
  <header class="top-bar">
    <span>Ternwell Chat</span>
    <div class="account-controls" id="account-controls" hidden>
      <span class="account-email" id="account-email"></span>
      <button class="button" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <section class="panel welcome" id="welcome-panel" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Sign in</h1>
      <p class="welcome-status" id="welcome-status" role="status">Checking sign-in…</p>
      <a class="button button-primary" id="sign-in" href="/login" hidden>Sign in with Google</a>
      <button class="button" id="retry-sign-in" type="button" hidden>Try again</button>
      <noscript>Enable JavaScript to use Ternwell Chat.</noscript>
    </section>

    <div class="workspace" id="chat-panel" hidden>
      <aside class="panel history" aria-labelledby="history-title">
        <h2 id="history-title">Chats</h2>
        <button class="button" id="new-chat" type="button">New chat</button>
        <p class="history-status" id="history-status" role="status"></p>
        <nav class="chat-list" id="chat-list" aria-label="Saved chats"></nav>
      </aside>

      <section class="panel" aria-labelledby="chat-title">
        <header class="chat-header">
          <h1 id="chat-title">Conversation</h1>
        </header>

        <div class="conversation" id="conversation">
          <p class="empty-state" id="empty-state">Ask about Ternwell policies and documents.</p>
          <div class="messages" id="messages" role="log" aria-label="Chat messages"></div>
        </div>

        <form class="composer" id="chat-form">
          <label for="question">Your question</label>
          <div class="composer-row">
            <textarea id="question" rows="2" maxlength="4000" required></textarea>
            <button class="button button-primary" id="send-message" type="submit">Send</button>
          </div>
          <p class="chat-status" id="chat-status" role="status"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>

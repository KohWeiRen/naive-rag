name: personal-rag

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rag_data:/var/lib/postgresql/data
    healthcheck:
      test: 
        - "CMD-SHELL"
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  rag_data: